<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy 3D Voxel Bird</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Light Sky Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevent browser scrolling on touch */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        #score-board {
            font-size: 5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5), 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-top: 10vh;
            transition: transform 0.1s ease-in-out;
        }

        .score-pop {
            transform: scale(1.2);
        }

        #powerup-status {
            margin-top: 8px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            min-height: 1.6rem;
            display: flex;
            gap: 14px;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,240,240,0.9));
            padding: 3rem 4rem;
            border-radius: 24px;
            border: 4px solid #fff;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .hidden {
            display: none !important;
        }

        .play-btn {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1B5E20, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .play-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1B5E20, 0 4px 10px rgba(0,0,0,0.3);
        }

        .title {
            font-size: 3rem;
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .instructions {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
            font-weight: bold;
        }

        .legend {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        #achievement-toast-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
            align-items: flex-end;
        }

        .achievement-toast {
            background: linear-gradient(135deg, rgba(35,35,40,0.95), rgba(15,15,20,0.95));
            border: 3px solid #FFD700;
            border-radius: 10px;
            padding: 10px 18px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(140%);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            max-width: 280px;
        }

        .achievement-toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .achievement-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .achievement-text .ach-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #FFD700;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .achievement-text .ach-name {
            font-size: 1.05rem;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="score-board">0</div>
        <div id="powerup-status"></div>
    </div>

    <div id="achievement-toast-container"></div>

    <div id="menu">
        <h1 class="title" id="menu-title">Steve Bird</h1>
        <p class="instructions" id="menu-desc">Tap, Click, or Space to Fly!</p>
        <p class="legend">💎 Shield &nbsp; 💚 Floaty &nbsp; 🥇 x2 Points &nbsp; 🐷 Friends &nbsp; 💥 Surprise!</p>
        <button class="play-btn" id="start-btn">PLAY</button>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const powerupStatusEl = document.getElementById('powerup-status');
        const achievementContainer = document.getElementById('achievement-toast-container');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('start-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');

        // ============================================================
        // AUDIO — simple synthesized sound effects (Web Audio API)
        // ============================================================
        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, duration, type = 'sine', gain = 0.18, delay = 0, sweepTo = null) {
            ensureAudio();
            const t0 = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (sweepTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(sweepTo, 1), t0 + duration);
            g.gain.setValueAtTime(gain, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
            osc.connect(g).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + duration + 0.02);
        }

        function playNoiseBurst(duration = 0.25, gain = 0.22) {
            ensureAudio();
            const bufferSize = Math.floor(audioCtx.sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(gain, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            source.connect(filter).connect(g).connect(audioCtx.destination);
            source.start();
        }

        function sfxJump() { playTone(500, 0.12, 'square', 0.12, 0, 780); }
        function sfxScore() { playTone(880, 0.09, 'triangle', 0.15); playTone(1180, 0.12, 'triangle', 0.12, 0.06); }
        function sfxCollect(type) {
            if (type === 'diamond') {
                playTone(1046, 0.08, 'sine', 0.18); playTone(1318, 0.08, 'sine', 0.16, 0.07); playTone(1568, 0.12, 'sine', 0.14, 0.14);
            } else if (type === 'emerald') {
                playTone(660, 0.15, 'triangle', 0.16); playTone(880, 0.15, 'triangle', 0.14, 0.08);
            } else {
                playTone(784, 0.1, 'square', 0.15); playTone(988, 0.1, 'square', 0.13, 0.06); playTone(1176, 0.14, 'square', 0.12, 0.12);
            }
        }
        function sfxMobBoop() { playTone(320, 0.08, 'sine', 0.18); playTone(520, 0.1, 'sine', 0.14, 0.05); }
        function sfxCreeperBoom() { playNoiseBurst(0.3, 0.22); playTone(150, 0.2, 'sine', 0.15, 0, 60); }
        function sfxAchievement() { playTone(659, 0.1, 'triangle', 0.15); playTone(880, 0.1, 'triangle', 0.15, 0.1); playTone(1046, 0.18, 'triangle', 0.16, 0.2); }
        function sfxGameOver() { playTone(400, 0.2, 'sawtooth', 0.15, 0, 180); playTone(300, 0.25, 'sawtooth', 0.13, 0.15, 120); }

        // ============================================================
        // ACHIEVEMENTS — Minecraft-style toast popups
        // ============================================================
        const unlockedAchievements = new Set();
        function unlockAchievement(id, icon, title) {
            if (unlockedAchievements.has(id)) return;
            unlockedAchievements.add(id);
            showAchievementToast(icon, title);
            sfxAchievement();
        }
        function showAchievementToast(icon, title) {
            const toast = document.createElement('div');
            toast.className = 'achievement-toast';
            toast.innerHTML = `<span class="achievement-icon">${icon}</span><span class="achievement-text"><span class="ach-title">Achievement Get!</span><br><span class="ach-name">${title}</span></span>`;
            achievementContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 450);
            }, 2600);
        }

        const scoreMilestones = [
            { score: 10, id: 'score_10', icon: '⛏️', title: 'Getting Started' },
            { score: 25, id: 'score_25', icon: '🦅', title: 'Sky High' },
            { score: 50, id: 'score_50', icon: '🚀', title: 'Master Flyer' },
            { score: 100, id: 'score_100', icon: '👑', title: 'Legendary!' }
        ];
        function checkScoreMilestones() {
            scoreMilestones.forEach(m => { if (score >= m.score) unlockAchievement(m.id, m.icon, m.title); });
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x73C2FB); // Vibrant Sky Blue
        scene.fog = new THREE.Fog(0x73C2FB, 20, 60);

        // Camera setup - slightly angled to show 3D depth better
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(0, 5, 18);
        camera.lookAt(0, 5, 0);

        // Renderer setup with shadows
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // High quality soft shadows
        container.appendChild(renderer.domElement);

        // Ambient light for general illumination
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Directional "Sun" light casting soft shadows
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(15, 30, 20);
        sunLight.castShadow = true;
        // Increase shadow resolution and area
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        const shadowSize = 25;
        sunLight.shadow.camera.left = -shadowSize;
        sunLight.shadow.camera.right = shadowSize;
        sunLight.shadow.camera.top = shadowSize;
        sunLight.shadow.camera.bottom = -shadowSize;
        // Soften shadow edges
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // Using MeshStandardMaterial for realistic light/shadow interaction
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xFAD6B1, roughness: 0.8 }); // Peach
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x4A3018, roughness: 0.9 }); // Brown
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0x00A8A8, roughness: 0.8 }); // Cyan
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x3F3F96, roughness: 0.8 }); // Blue
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 }); // Dark Gray

        const groundTopMat = new THREE.MeshStandardMaterial({ color: 0x55AA33, roughness: 1.0 }); // Grass
        const groundSideMat = new THREE.MeshStandardMaterial({ color: 0x664422, roughness: 1.0 }); // Dirt

        // Themed pipe "blocks" — randomly picked so the level looks like different Minecraft blocks
        const pipeVariants = [
            { key: 'grass', weight: 55, mat: new THREE.MeshStandardMaterial({ color: 0x66CC33, roughness: 0.6, metalness: 0.1 }) },
            { key: 'stone', weight: 18, mat: new THREE.MeshStandardMaterial({ color: 0x8C8C8C, roughness: 0.9 }) },
            { key: 'gold', weight: 10, mat: new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.7 }) },
            { key: 'diamond', weight: 9, mat: new THREE.MeshStandardMaterial({ color: 0x66D9E8, roughness: 0.2, metalness: 0.5, emissive: 0x1a6b73, emissiveIntensity: 0.3 }) },
            { key: 'obsidian', weight: 6, mat: new THREE.MeshStandardMaterial({ color: 0x2B1B3D, roughness: 0.6, metalness: 0.4 }) },
            { key: 'tnt', weight: 2, mat: new THREE.MeshStandardMaterial({ color: 0xE8453C, roughness: 0.7 }) }
        ];
        function pickPipeVariant() {
            const total = pipeVariants.reduce((s, v) => s + v.weight, 0);
            let r = Math.random() * total;
            for (const v of pipeVariants) {
                if (r < v.weight) return v;
                r -= v.weight;
            }
            return pipeVariants[0];
        }

        // Collectible power-up materials
        const diamondMat = new THREE.MeshStandardMaterial({ color: 0x4DD9E8, roughness: 0.15, metalness: 0.6, emissive: 0x1a6b73, emissiveIntensity: 0.5 });
        const emeraldMat = new THREE.MeshStandardMaterial({ color: 0x17C964, roughness: 0.15, metalness: 0.5, emissive: 0x0a5c2c, emissiveIntensity: 0.5 });
        const goldItemMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.25, metalness: 0.8, emissive: 0x7a5f00, emissiveIntensity: 0.4 });

        const playerGroup = new THREE.Group();
        const steve = new THREE.Group();

        // Steve's dimensions (relative units)
        const unit = 0.5; // Scale factor

        // Head (8x8x8 pixels in MC, we use 1x1x1 relative)
        const headGeom = new THREE.BoxGeometry(unit * 2, unit * 2, unit * 2);
        const head = new THREE.Mesh(headGeom, skinMat);
        head.position.y = unit * 3;
        head.castShadow = true;
        head.receiveShadow = true;
        steve.add(head);

        // Hair (Slightly larger than head on top)
        const hairGeom = new THREE.BoxGeometry(unit * 2.05, unit * 0.5, unit * 2.05);
        const hair = new THREE.Mesh(hairGeom, hairMat);
        hair.position.y = unit;
        hair.castShadow = true;
        head.add(hair);

        // Body (8x12x4 pixels)
        const bodyGeom = new THREE.BoxGeometry(unit * 2, unit * 3, unit * 1);
        const body = new THREE.Mesh(bodyGeom, shirtMat);
        body.position.y = unit * 0.5;
        body.castShadow = true;
        body.receiveShadow = true;
        steve.add(body);

        // Arms (4x12x4 pixels) - Positioned on the Z-axis (sides) because he will face X
        const armGeom = new THREE.BoxGeometry(unit * 1, unit * 3, unit * 1);

        const leftArm = new THREE.Mesh(armGeom, skinMat);
        leftArm.position.set(0, unit * 0.5, -unit * 1.5); // Back side in side-profile
        leftArm.castShadow = true;
        steve.add(leftArm);

        const rightArm = new THREE.Mesh(armGeom, skinMat);
        rightArm.position.set(0, unit * 0.5, unit * 1.5); // Front side in side-profile
        rightArm.castShadow = true;
        steve.add(rightArm);

        // Sleeves
        const sleeveGeom = new THREE.BoxGeometry(unit * 1.05, unit * 1.5, unit * 1.05);
        const leftSleeve = new THREE.Mesh(sleeveGeom, shirtMat);
        leftSleeve.position.y = unit * 0.75;
        leftArm.add(leftSleeve);
        const rightSleeve = new THREE.Mesh(sleeveGeom, shirtMat);
        rightSleeve.position.y = unit * 0.75;
        rightArm.add(rightSleeve);

        // Legs (4x12x4 pixels)
        const legGeom = new THREE.BoxGeometry(unit * 1, unit * 3, unit * 1);

        const leftLeg = new THREE.Mesh(legGeom, pantsMat);
        leftLeg.position.set(0, -unit * 2.5, -unit * 0.5);
        leftLeg.castShadow = true;
        steve.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeom, pantsMat);
        rightLeg.position.set(0, -unit * 2.5, unit * 0.5);
        rightLeg.castShadow = true;
        steve.add(rightLeg);

        // Shoes
        const shoeGeom = new THREE.BoxGeometry(unit * 1.05, unit * 0.5, unit * 1.05);
        const leftShoe = new THREE.Mesh(shoeGeom, shoeMat);
        leftShoe.position.y = -unit * 1.25;
        leftLeg.add(leftShoe);
        const rightShoe = new THREE.Mesh(shoeGeom, shoeMat);
        rightShoe.position.y = -unit * 1.25;
        rightLeg.add(rightShoe);

        // Default BoxGeometries face forward (+Z). We need Steve to fly right (+X).
        // If we rotate him on Y by 90 degrees, he faces +X.
        steve.rotation.y = Math.PI / 2;

        // Slightly rotate arms/legs for a "flying/walking" dynamic pose
        leftArm.rotation.z = -0.3;
        rightArm.rotation.z = 0.3;
        leftLeg.rotation.z = 0.2;
        rightLeg.rotation.z = -0.2;

        // A shield glow sphere around Steve, toggled visible while the diamond power-up is active
        const shieldGlowMat = new THREE.MeshBasicMaterial({ color: 0x4DD9E8, transparent: true, opacity: 0.35 });
        const shieldGlow = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 12), shieldGlowMat);
        shieldGlow.visible = false;
        playerGroup.add(shieldGlow);

        playerGroup.add(steve);
        scene.add(playerGroup);

        // Ground setup - large plane so shadows have space
        const groundGroup = new THREE.Group();

        // Dirt base
        const dirtGeom = new THREE.BoxGeometry(100, 10, 30);
        const dirt = new THREE.Mesh(dirtGeom, groundSideMat);
        dirt.position.y = -5; // Sink it down
        dirt.receiveShadow = true;
        groundGroup.add(dirt);

        // Grass top
        const grassGeom = new THREE.BoxGeometry(100, 1, 30);
        const grass = new THREE.Mesh(grassGeom, groundTopMat);
        grass.position.y = 0.5;
        grass.receiveShadow = true;
        groundGroup.add(grass);

        scene.add(groundGroup);

        // Background Clouds (Simple blocks)
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 1.0, transparent: true, opacity: 0.9 });
        const clouds = [];
        for (let i = 0; i < 10; i++) {
            const w = 4 + Math.random() * 6;
            const h = 2 + Math.random() * 2;
            const d = 3 + Math.random() * 4;
            const cloud = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloudMat);
            cloud.position.set(
                (Math.random() - 0.5) * 80,
                12 + Math.random() * 8,
                -15 - Math.random() * 10
            );
            cloud.receiveShadow = true; // Clouds receive shadow from sun
            scene.add(cloud);
            clouds.push(cloud);
        }

        // ============================================================
        // MINECRAFT MOB CAMEOS — friendly floating mobs & a cute creeper
        // ============================================================
        function box(w, h, d, mat) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.castShadow = true;
            return m;
        }

        function createPig() {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xF3B4C0, roughness: 0.8 });
            const snoutMat = new THREE.MeshStandardMaterial({ color: 0xE8899C, roughness: 0.8 });
            g.add(box(1.6, 1, 1, bodyMat));
            const head = box(0.8, 0.8, 0.8, bodyMat);
            head.position.set(1.0, 0.1, 0);
            g.add(head);
            const snout = box(0.3, 0.3, 0.5, snoutMat);
            snout.position.set(1.45, 0.05, 0.4);
            g.add(snout);
            const earL = box(0.25, 0.25, 0.1, bodyMat); earL.position.set(0.8, 0.55, -0.3); g.add(earL);
            const earR = box(0.25, 0.25, 0.1, bodyMat); earR.position.set(0.8, 0.55, 0.3); g.add(earR);
            return g;
        }

        function createCow() {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xF5F0E6, roughness: 0.8 });
            const patchMat = new THREE.MeshStandardMaterial({ color: 0x3A2A1E, roughness: 0.8 });
            g.add(box(1.8, 1.1, 1.1, bodyMat));
            const patch1 = box(0.6, 0.5, 0.3, patchMat); patch1.position.set(-0.3, 0.2, 0.56); g.add(patch1);
            const patch2 = box(0.5, 0.4, 0.3, patchMat); patch2.position.set(0.5, -0.15, -0.56); g.add(patch2);
            const head = box(0.8, 0.75, 0.75, patchMat);
            head.position.set(1.1, 0.15, 0);
            g.add(head);
            const hornL = box(0.12, 0.25, 0.12, new THREE.MeshStandardMaterial({ color: 0xDDDDDD })); hornL.position.set(1.35, 0.6, -0.25); g.add(hornL);
            const hornR = box(0.12, 0.25, 0.12, new THREE.MeshStandardMaterial({ color: 0xDDDDDD })); hornR.position.set(1.35, 0.6, 0.25); g.add(hornR);
            return g;
        }

        function createChicken() {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.9 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xFFA726, roughness: 0.6 });
            const combMat = new THREE.MeshStandardMaterial({ color: 0xE53935, roughness: 0.6 });
            g.add(box(1.0, 0.8, 0.8, bodyMat));
            const head = box(0.5, 0.5, 0.5, bodyMat);
            head.position.set(0.65, 0.35, 0);
            g.add(head);
            const beak = box(0.25, 0.15, 0.25, beakMat); beak.position.set(0.95, 0.3, 0); g.add(beak);
            const comb = box(0.15, 0.2, 0.15, combMat); comb.position.set(0.65, 0.65, 0); g.add(comb);
            return g;
        }

        function createSheep() {
            const g = new THREE.Group();
            const woolMat = new THREE.MeshStandardMaterial({ color: 0xEDEAE0, roughness: 1.0 });
            const headMat = new THREE.MeshStandardMaterial({ color: 0x4A4A4A, roughness: 0.8 });
            g.add(box(1.8, 1.3, 1.2, woolMat));
            const bump1 = box(0.6, 0.4, 0.6, woolMat); bump1.position.set(-0.4, 0.75, 0); g.add(bump1);
            const bump2 = box(0.6, 0.4, 0.6, woolMat); bump2.position.set(0.4, 0.75, 0.2); g.add(bump2);
            const head = box(0.6, 0.6, 0.6, headMat);
            head.position.set(1.1, 0.1, 0);
            g.add(head);
            return g;
        }

        function createCreeper() {
            const g = new THREE.Group();
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x3BA53B, roughness: 0.9 });
            const faceGreenMat = new THREE.MeshStandardMaterial({ color: 0x4FBF4F, roughness: 0.9 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x101410, roughness: 0.9 });
            g.add(box(1.0, 1.6, 1.0, greenMat));
            const head = box(1.1, 1.1, 1.1, faceGreenMat);
            head.position.set(0, 1.15, 0);
            g.add(head);
            // Classic blocky creeper face on the +Z side
            const eyeL = box(0.22, 0.22, 0.08, blackMat); eyeL.position.set(-0.25, 1.3, 0.57); g.add(eyeL);
            const eyeR = box(0.22, 0.22, 0.08, blackMat); eyeR.position.set(0.25, 1.3, 0.57); g.add(eyeR);
            const mouthTop = box(0.5, 0.18, 0.08, blackMat); mouthTop.position.set(0, 1.05, 0.57); g.add(mouthTop);
            const mouthL = box(0.18, 0.3, 0.08, blackMat); mouthL.position.set(-0.2, 0.85, 0.57); g.add(mouthL);
            const mouthR = box(0.18, 0.3, 0.08, blackMat); mouthR.position.set(0.2, 0.85, 0.57); g.add(mouthR);
            return g;
        }

        const mobBuilders = {
            pig: createPig,
            cow: createCow,
            chicken: createChicken,
            sheep: createSheep,
            creeper: createCreeper
        };
        const mobWeights = [
            { type: 'pig', weight: 30 },
            { type: 'cow', weight: 25 },
            { type: 'chicken', weight: 20 },
            { type: 'sheep', weight: 15 },
            { type: 'creeper', weight: 10 }
        ];
        function pickMobType() {
            const total = mobWeights.reduce((s, v) => s + v.weight, 0);
            let r = Math.random() * total;
            for (const v of mobWeights) {
                if (r < v.weight) return v.type;
                r -= v.weight;
            }
            return 'pig';
        }

        const mobBonusPoints = { pig: 3, cow: 3, chicken: 3, sheep: 3, creeper: 8 };
        const cuteBurstColors = [0xF3B4C0, 0xFFFFFF, 0xFFD54F];
        const creeperBurstColors = [0x3BA53B, 0x2E2E2E, 0xFFD700];

        function spawnParticleBurst(position, colors) {
            for (let i = 0; i < 12; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), mat);
                mesh.position.copy(position);
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                const vel = new THREE.Vector3(Math.cos(angle) * speed, Math.random() * 4 + 1, Math.sin(angle) * speed * 0.4);
                scene.add(mesh);
                particles.push({ mesh, vel, age: 0, life: 0.6 + Math.random() * 0.3 });
            }
        }

        function touchMob(mob) {
            mob.userData.touched = true;
            spawnParticleBurst(mob.position, mob.userData.type === 'creeper' ? creeperBurstColors : cuteBurstColors);
            addScore(mobBonusPoints[mob.userData.type]);
            if (mob.userData.type === 'creeper') {
                sfxCreeperBoom();
                unlockAchievement('first_creeper', '💥', 'Ssssurprise!');
            } else {
                sfxMobBoop();
                unlockAchievement('first_mob', '🐷', 'Animal Friend!');
            }
            scene.remove(mob);
        }

        function spawnMob() {
            const type = pickMobType();
            const group = mobBuilders[type]();
            const y = 5 + Math.random() * 11;
            group.position.set(PIPE_SPAWN_X + 10, y, 0);
            group.userData = { type, baseY: y, phase: Math.random() * Math.PI * 2, bobSpeed: 0.8 + Math.random() * 0.6, touched: false };
            scene.add(group);
            mobs.push(group);
        }

        // ============================================================
        // COLLECTIBLE POWER-UPS — diamond / emerald / gold
        // ============================================================
        function createPowerup(type) {
            let geom, mat;
            if (type === 'diamond') { geom = new THREE.OctahedronGeometry(0.9, 0); mat = diamondMat; }
            else if (type === 'emerald') { geom = new THREE.IcosahedronGeometry(0.8, 0); mat = emeraldMat; }
            else { geom = new THREE.BoxGeometry(1.1, 1.1, 1.1); mat = goldItemMat; }
            const mesh = new THREE.Mesh(geom, mat);
            mesh.castShadow = true;
            const y = 4 + Math.random() * 12;
            mesh.position.set(PIPE_SPAWN_X + 6, y, 0);
            scene.add(mesh);
            return { mesh, type, baseY: y, phase: Math.random() * Math.PI * 2, spinSpeed: 1 + Math.random() };
        }

        function collectPowerup(p) {
            scene.remove(p.mesh);
            addScore(5);
            sfxCollect(p.type);
            if (p.type === 'diamond') {
                shieldUntil = playTime + SHIELD_DURATION;
                unlockAchievement('first_diamond', '💎', 'Ooh, Shiny!');
            } else if (p.type === 'emerald') {
                slowmoUntil = playTime + SLOWMO_DURATION;
                unlockAchievement('first_emerald', '💚', 'Emerald Explorer');
            } else {
                multiplierUntil = playTime + MULTIPLIER_DURATION;
                unlockAchievement('first_gold', '🥇', 'Gold Rush');
            }
        }

        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let pipes = [];
        let powerups = [];
        let mobs = [];
        let particles = [];

        // ***** VERY EASY DIFFICULTY SETTINGS FOR A 7-YEAR-OLD *****
        const GRAVITY = 22; // Very gentle gravity (was 45)
        const JUMP_STRENGTH = 11; // Floaty jump
        const PIPE_SPEED = 4.5; // Slow moving pipes (was 8)
        const PIPE_SPAWN_X = 25; // Spawn further off screen
        const BIRD_START_X = -5; // Player sits slightly left of center
        const PIPE_SPAWN_INTERVAL = 3.5; // Lots of time between pipes

        // Power-up / surprise tuning
        const SHIELD_DURATION = 4;
        const SLOWMO_DURATION = 4;
        const SLOWMO_GRAVITY_MULT = 0.5;
        const MULTIPLIER_DURATION = 6;

        let velocityY = 0;
        let lastTime = performance.now();
        let pipeSpawnTimer = 0;
        let playTime = 0;

        let powerupSpawnTimer = 0;
        let nextPowerupSpawn = 6 + Math.random() * 4;
        let mobSpawnTimer = 0;
        let nextMobSpawn = 7 + Math.random() * 5;

        let shieldUntil = 0;
        let slowmoUntil = 0;
        let multiplierUntil = 0;

        // Collision Boxes
        const playerBox = new THREE.Box3();
        const pipeBoxTop = new THREE.Box3();
        const pipeBoxBottom = new THREE.Box3();

        function createPipe() {
            // Massive gaps for easy playability
            const gapSize = 8.5 + Math.random() * 2.5;
            const minBottomHeight = 2;
            const maxBottomHeight = 7;
            const bottomHeight = minBottomHeight + Math.random() * (maxBottomHeight - minBottomHeight);
            const topHeight = 25; // Extends way above screen

            const pipeGroup = new THREE.Group();
            const variant = pickPipeVariant();

            // Generate standard blocky pipes
            const pipeWidth = 3;
            const pipeDepth = 3;

            // Bottom pipe
            const bottomGeom = new THREE.BoxGeometry(pipeWidth, bottomHeight, pipeDepth);
            const bottomPipe = new THREE.Mesh(bottomGeom, variant.mat);
            bottomPipe.position.y = bottomHeight / 2 + 1; // +1 to sit right on top of grass
            bottomPipe.castShadow = true;
            bottomPipe.receiveShadow = true;
            pipeGroup.add(bottomPipe);

            // Top pipe
            const topGeom = new THREE.BoxGeometry(pipeWidth, topHeight, pipeDepth);
            const topPipe = new THREE.Mesh(topGeom, variant.mat);
            // Positioned above bottom pipe + gap
            topPipe.position.y = bottomHeight + 1 + gapSize + (topHeight / 2);
            topPipe.castShadow = true;
            topPipe.receiveShadow = true;
            pipeGroup.add(topPipe);

            pipeGroup.position.x = PIPE_SPAWN_X;
            scene.add(pipeGroup);

            return {
                group: pipeGroup,
                bottom: bottomPipe,
                top: topPipe,
                passed: false,
                variantKey: variant.key
            };
        }

        function jump() {
            if (!isPlaying && !isGameOver) return;
            if (isGameOver) return;
            velocityY = JUMP_STRENGTH;
            sfxJump();
        }

        // Handle all input types easily
        function handleInput(e) {
            // Prevent default behavior to stop double firing on touch devices
            if (e.type !== 'keydown') {
                if (e.target === startBtn) return;
            }

            if (e.type === 'keydown' && e.code !== 'Space') return;

            if (!isPlaying && !isGameOver) {
                startGame();
            } else if (isPlaying) {
                jump();
            }
        }

        window.addEventListener('keydown', handleInput);
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput, { passive: false });
        startBtn.addEventListener('click', startGame);

        function clearEntities(list) {
            list.forEach(item => scene.remove(item.mesh || item.group || item));
            list.length = 0;
        }

        function resetGame() {
            // Cleanup old pipes / power-ups / mobs / particles
            clearEntities(pipes);
            clearEntities(powerups);
            clearEntities(mobs);
            clearEntities(particles);

            // Reset Steve
            playerGroup.position.set(BIRD_START_X, 8, 0);
            playerGroup.rotation.z = 0;
            velocityY = 0;

            // Reset Stats
            score = 0;
            scoreBoard.innerText = score;
            pipeSpawnTimer = PIPE_SPAWN_INTERVAL; // Force spawn immediately
            lastTime = performance.now();
            playTime = 0;

            powerupSpawnTimer = 0;
            nextPowerupSpawn = 6 + Math.random() * 4;
            mobSpawnTimer = 0;
            nextMobSpawn = 7 + Math.random() * 5;

            shieldUntil = 0;
            slowmoUntil = 0;
            multiplierUntil = 0;
            shieldGlow.visible = false;
            powerupStatusEl.textContent = '';

            // Hide UI
            menu.classList.add('hidden');
            scoreBoard.classList.remove('hidden');
        }

        function startGame() {
            ensureAudio();
            resetGame();
            isPlaying = true;
            isGameOver = false;
            jump(); // Initial jump off the starting line
        }

        function gameOver() {
            isPlaying = false;
            isGameOver = true;
            sfxGameOver();

            menuTitle.innerText = "Game Over!";
            menuTitle.style.color = "#E53935"; // Red
            menuDesc.innerText = `You scored ${score} points!`;
            startBtn.innerText = "PLAY AGAIN";

            // Small delay so they don't accidentally restart instantly
            setTimeout(() => {
                menu.classList.remove('hidden');
            }, 500);
        }

        function addScore(amount) {
            const multiplied = (playTime < multiplierUntil) ? amount * 2 : amount;
            score += multiplied;
            scoreBoard.innerText = score;

            // Pop animation
            scoreBoard.classList.add('score-pop');
            setTimeout(() => {
                scoreBoard.classList.remove('score-pop');
            }, 100);

            checkScoreMilestones();
        }

        function updatePowerupHud() {
            const parts = [];
            if (playTime < shieldUntil) parts.push(`🛡️ ${Math.ceil(shieldUntil - playTime)}s`);
            if (playTime < slowmoUntil) parts.push(`🍃 ${Math.ceil(slowmoUntil - playTime)}s`);
            if (playTime < multiplierUntil) parts.push(`✨x2 ${Math.ceil(multiplierUntil - playTime)}s`);
            powerupStatusEl.textContent = parts.join('   ');
            shieldGlow.visible = playTime < shieldUntil;
        }

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const dt = Math.min((currentTime - lastTime) / 1000, 0.05); // Cap delta time
            lastTime = currentTime;

            if (isPlaying) {
                playTime += dt;

                // Apply Gravity (floatier while an emerald "slowmo" is active)
                const gravityMult = playTime < slowmoUntil ? SLOWMO_GRAVITY_MULT : 1;
                velocityY -= GRAVITY * gravityMult * dt;
                playerGroup.position.y += velocityY * dt;

                // Steve tilting animation (gentle tilt based on velocity)
                // Since Steve is facing +X, tilting his nose up means rotating around +Z
                const targetRotation = Math.max(-Math.PI / 4, Math.min(Math.PI / 6, velocityY * 0.05));
                // Smoothly interpolate rotation
                playerGroup.rotation.z += (targetRotation - playerGroup.rotation.z) * 10 * dt;

                // Update Steve's Hitbox (Forgiving)
                playerBox.setFromObject(steve);
                // SHINK HITBOX significantly to make it very forgiving for kids
                playerBox.expandByScalar(-0.4);

                // Floor Collision Check (Grass top is at y = 1)
                if (playerGroup.position.y <= 2.5) { // Stop slightly above floor center
                    playerGroup.position.y = 2.5;
                    gameOver();
                }
                // Ceiling Check (Invisible roof)
                if (playerGroup.position.y >= 20) {
                    playerGroup.position.y = 20;
                    velocityY = 0;
                }

                // Pipe Spawning & Movement
                pipeSpawnTimer += dt;
                if (pipeSpawnTimer >= PIPE_SPAWN_INTERVAL) {
                    pipes.push(createPipe());
                    pipeSpawnTimer = 0;
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.group.position.x -= PIPE_SPEED * dt;

                    // Collision Check
                    pipeBoxTop.setFromObject(p.top);
                    pipeBoxBottom.setFromObject(p.bottom);

                    const hitPipe = playerBox.intersectsBox(pipeBoxTop) || playerBox.intersectsBox(pipeBoxBottom);
                    if (hitPipe && playTime >= shieldUntil) {
                        gameOver();
                    }

                    // Score Tracking
                    if (!p.passed && p.group.position.x < BIRD_START_X) {
                        p.passed = true;
                        addScore(1);
                        sfxScore();
                        if (p.variantKey === 'tnt') unlockAchievement('boom_dodger', '🧨', 'Boom Dodger');
                    }

                    // Garbage Collection
                    if (p.group.position.x < -15) {
                        scene.remove(p.group);
                        pipes.splice(i, 1);
                    }
                }

                // Power-up spawning & movement
                powerupSpawnTimer += dt;
                if (powerupSpawnTimer >= nextPowerupSpawn) {
                    const roll = Math.random();
                    const type = roll < 0.45 ? 'gold' : (roll < 0.8 ? 'emerald' : 'diamond');
                    powerups.push(createPowerup(type));
                    powerupSpawnTimer = 0;
                    nextPowerupSpawn = 6 + Math.random() * 4;
                }
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const p = powerups[i];
                    p.mesh.position.x -= PIPE_SPEED * dt;
                    p.mesh.rotation.y += p.spinSpeed * dt;
                    p.mesh.position.y = p.baseY + Math.sin(playTime * 1.5 + p.phase) * 0.4;

                    if (playerGroup.position.distanceTo(p.mesh.position) < 1.8) {
                        collectPowerup(p);
                        powerups.splice(i, 1);
                        continue;
                    }
                    if (p.mesh.position.x < -15) {
                        scene.remove(p.mesh);
                        powerups.splice(i, 1);
                    }
                }

                // Mob spawning & movement
                mobSpawnTimer += dt;
                if (mobSpawnTimer >= nextMobSpawn) {
                    spawnMob();
                    mobSpawnTimer = 0;
                    nextMobSpawn = 7 + Math.random() * 5;
                }
                for (let i = mobs.length - 1; i >= 0; i--) {
                    const m = mobs[i];
                    m.position.x -= PIPE_SPEED * 0.9 * dt;
                    m.position.y = m.userData.baseY + Math.sin(playTime * m.userData.bobSpeed + m.userData.phase) * 0.7;
                    m.rotation.y += dt * 0.3;

                    if (!m.userData.touched && playerGroup.position.distanceTo(m.position) < 2.2) {
                        touchMob(m);
                        mobs.splice(i, 1);
                        continue;
                    }
                    if (m.position.x < -15) {
                        scene.remove(m);
                        mobs.splice(i, 1);
                    }
                }

                // Scroll the ground for infinite movement illusion
                groundGroup.position.x -= PIPE_SPEED * dt;
                if (groundGroup.position.x <= -20) {
                    groundGroup.position.x += 20; // Reset position cleanly
                }

                updatePowerupHud();
            }

            // Particle bursts animate regardless of play state so they finish nicely
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.age += dt;
                pt.mesh.position.addScaledVector(pt.vel, dt);
                pt.vel.y -= 9 * dt;
                const t = pt.age / pt.life;
                pt.mesh.scale.setScalar(Math.max(0, 1 - t));
                if (pt.age >= pt.life) {
                    scene.remove(pt.mesh);
                    particles.splice(i, 1);
                }
            }

            // Animate clouds regardless of play state
            clouds.forEach(cloud => {
                cloud.position.x -= (PIPE_SPEED * 0.05) * dt;
                if (cloud.position.x < -50) cloud.position.x = 50;
            });

            // Render scene
            renderer.render(scene, camera);
        }

        // Position Steve at start for the menu screen
        playerGroup.position.set(BIRD_START_X, 8, 0);

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start loop
        animate();
    </script>
</body>
</html>
